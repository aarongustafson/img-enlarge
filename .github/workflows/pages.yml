name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
        paths:
            - 'demo/**'
            - 'img-enlarge.js'
            - 'img-enlarge-styles.js'
            - 'define.js'
            - 'index.js'
            - 'README.md'
            - 'LICENSE'
            - 'package-lock.json'
            - '.github/workflows/pages.yml'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build Pages
              run: |
                  mkdir _site
                  cp -R demo _site/demo
                  cp img-enlarge.js img-enlarge-styles.js define.js index.js README.md LICENSE _site/
                  echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>img-enlarge</title><style>body{max-width:800px;margin:2rem auto;padding:0 1rem;font-family:system-ui,-apple-system,sans-serif;line-height:1.6}code{background:#f4f4f4;padding:2px 6px;border-radius:3px}pre{background:#f4f4f4;padding:1rem;border-radius:5px;overflow-x:auto}pre code{background:none;padding:0}</style></head><body>' > _site/index.html
                  npm exec --offline --no -- marked README.md >> _site/index.html
                  echo '</body></html>' >> _site/index.html

            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Upload artifact
              # Keep the uploader compatible with deploy-pages@v5's artifact client.
              uses: actions/upload-pages-artifact@v4
              with:
                  path: '_site'

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
